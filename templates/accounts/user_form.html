{% extends 'base.html' %}
{% block content %}
<h4>Usuário</h4>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3"><label>{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-primary">Salvar</button>
</form>
{% endblock %}
