{% extends 'base.html' %}
{% block content %}
<h4>Solicitar carro</h4>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label>{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
    {% endfor %}
    <button class="btn btn-primary">Enviar solicitação</button>
</form>
{% endblock %}
