{% extends 'base.html' %}
{% block content %}
<h4>Veículo</h4>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% if object.photo %}
        <img src="{{ object.photo.url }}" style="max-width:200px;" class="mb-3 d-block rounded">
    {% endif %}
    {% for field in form %}
        <div class="mb-3">
            <label>{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
    {% endfor %}
    <button class="btn btn-primary">Salvar</button>
</form>
{% endblock %}
